<!doctype html>
<meta charset="utf-8" />
<title>msg-hub</title>
<link rel="stylesheet" href="styl.css" />
<header id="pasek">
  <nav id="zakladki"></nav>
  <p id="komunikat" class="bledy" hidden></p>
  <button id="otworz-makra" title="Makra (Ctrl+;)">Makra</button>
  <button id="otworz-ustawienia" title="Ustawienia">Ustawienia</button>
  <button id="dodaj-konto" title="Dodaj konto">+</button>
</header>
<dialog id="okno-konta">
  <form method="dialog">
    <h2 id="tytul-konta">Dodaj konto</h2>
    <label>Nazwa <input name="nazwa" required /></label>
    <label>Platforma
      <select name="platforma">
        <option value="whatsapp">WhatsApp</option>
        <option value="messenger">Messenger</option>
      </select>
    </label>
    <label>Kolor zakladki <input name="kolor" type="color" value="#2f7d5b" /></label>
    <p id="bledy-konta" class="bledy"></p>
    <menu>
      <!-- formnovalidate: bez tego walidacja pustego pola "Nazwa" blokuje anulowanie -->
      <button value="anuluj" formnovalidate>Anuluj</button>
      <button id="zapisz-konto" value="zapisz">Zapisz</button>
    </menu>
  </form>
</dialog>
<dialog id="okno-ustawien">
  <h2>Ustawienia</h2>
  <section>
    <h3>Zarzadzanie kontami</h3>
    <ul id="lista-kont"></ul>
    <button type="button" id="dodaj-konto-ustawienia">Dodaj konto</button>
  </section>
  <menu>
    <button id="zamknij-ustawienia" value="zamknij">Zamknij</button>
  </menu>
</dialog>
<dialog id="okno-usuwania">
  <h2>Usunac konto?</h2>
  <p id="tresc-usuwania"></p>
  <p class="ostrzezenie">Zalogowanie zostanie skasowane — ponowne dodanie konta wymaga nowego kodu QR.</p>
  <menu>
    <button id="anuluj-usuniecie" value="anuluj">Anuluj</button>
    <button id="potwierdz-usuniecie" value="usun" class="grozny">Usun konto</button>
  </menu>
</dialog>
<dialog id="okno-makr">
  <input id="szukaj-makro" placeholder="Szukaj makra..." autocomplete="off" />
  <ul id="lista-makr"></ul>
  <menu>
    <button id="zamknij-makra" value="zamknij">Zamknij</button>
    <button id="nowe-makro" value="nowe">Nowe makro</button>
  </menu>
</dialog>
<dialog id="okno-usuwania-makra">
  <h2>Usunac makro?</h2>
  <p id="tresc-usuwania-makra"></p>
  <menu>
    <button id="anuluj-usuniecie-makra" value="anuluj">Anuluj</button>
    <button id="potwierdz-usuniecie-makra" value="usun" class="grozny">Usun makro</button>
  </menu>
</dialog>
<dialog id="okno-edytora">
  <h2 id="tytul-edytora">Makro</h2>
  <label>Nazwa <input id="edytor-nazwa" /></label>
  <div id="pasek-formatowania">
    <button type="button" data-znacznik="*">Pogrubienie</button>
    <button type="button" data-znacznik="_">Kursywa</button>
    <button type="button" data-znacznik="~">Przekreslenie</button>
    <button type="button" data-prefiks="- ">Lista</button>
    <button type="button" data-prefiks="1. ">Numeracja</button>
    <button type="button" data-prefiks="&gt; ">Cytat</button>
  </div>
  <label>Tresc <textarea id="edytor-tekst" rows="8"></textarea></label>
  <p>Podglad:</p>
  <div id="edytor-podglad"></div>
  <p>Zalaczniki:</p>
  <ul id="lista-zalacznikow"></ul>
  <button type="button" id="dodaj-zalacznik">Dodaj zalacznik</button>
  <menu>
    <button id="anuluj-makro" value="anuluj">Anuluj</button>
    <button id="zapisz-makro" value="zapisz">Zapisz</button>
  </menu>
</dialog>
<script type="module" src="renderer.js"></script>
